name: Build Android APK

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK platform & build-tools
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run core tests
        run: ./gradlew :core:test --console=plain

      - name: Build debug APK
        run: ./gradlew :android:assembleDebug --console=plain

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gwent-debug-apk
          path: android/build/outputs/apk/debug/*.apk

      - name: Publish APK to a release for easy phone install
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Debug APK build #${{ github.run_number }}"
          body: "Automated debug build from ${{ github.ref_name }} @ ${{ github.sha }}. Install on Android by downloading the .apk below and allowing install from unknown sources."
          prerelease: true
          files: android/build/outputs/apk/debug/*.apk
