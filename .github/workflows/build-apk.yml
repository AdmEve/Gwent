name: Build Android APK

on:
  push:
    branches:
      - "claude/**"
      - "main"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android cmdline-tools
        run: |
          set -e
          SDK_ROOT="$HOME/android-sdk"
          mkdir -p "$SDK_ROOT/cmdline-tools"
          curl -sSL -o cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmdline-tools.zip -d "$SDK_ROOT/cmdline-tools"
          mv "$SDK_ROOT/cmdline-tools/cmdline-tools" "$SDK_ROOT/cmdline-tools/latest"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Accept licenses and install SDK platform & build-tools
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run engine tests
        run: ./gradlew :core:test --console=plain

      - name: Build debug APK
        run: ./gradlew :android:assembleDebug --console=plain

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: gwent-debug-apk
          path: android/build/outputs/apk/debug/*.apk

      - name: Publish APK to a release for easy phone install
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: "Debug APK build #${{ github.run_number }}"
          body: "Automated debug build from ${{ github.ref_name }} @ ${{ github.sha }}. Install on Android by downloading the .apk below and allowing install from unknown sources."
          prerelease: true
          files: android/build/outputs/apk/debug/*.apk

      # Runs last, on purpose: the APK is already published by this point, so a failure here
      # never withholds a build, but it does turn the run red instead of being swallowed by
      # continue-on-error (which reports a failed step as successful).
      #
      # This task also renders every screen to android/build/screenshots/*.png via Robolectric's
      # native graphics backend, so the UI can be reviewed without installing the APK.
      - name: Run Compose UI smoke tests and render screenshots
        timeout-minutes: 20
        run: ./gradlew :android:testDebugUnitTest --console=plain

      - name: Upload rendered screens as a workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gwent-screens
          path: android/build/screenshots/*.png
          if-no-files-found: warn

      # Committed back to the branch so the rendered UI is reviewable straight from the repo.
      # Pushes made with GITHUB_TOKEN do not trigger workflows, so this cannot loop.
      - name: Commit rendered screens to the branch
        if: always()
        run: |
          set -e
          shopt -s nullglob
          shots=(android/build/screenshots/*.png)
          if [ ${#shots[@]} -eq 0 ]; then
            echo "no screenshots were rendered"
            exit 0
          fi
          mkdir -p docs/screenshots
          rm -f docs/screenshots/*.png
          cp android/build/screenshots/*.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "screens unchanged"
            exit 0
          fi
          git commit -m "Render the current UI to docs/screenshots (run #${{ github.run_number }})"
          git push origin HEAD:${{ github.ref_name }}

      - name: Attach rendered screens to the release
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          files: android/build/screenshots/*.png
